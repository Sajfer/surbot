# Default values for surbot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Old ReplicaSets kept for rollback. Kubernetes defaults to 10.
revisionHistoryLimit: 3

image:
  repository: ghcr.io/sajfer/surbot
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

discord_token: ""
spotify_clientid: ""
spotify_clientsecret: ""

# Log at debug level, including discordgo's voice connection.
debug: false

# Comma-separated plugins to enable, in start order (fun, rajd, music). Empty enables all.
plugins: ""
# Discord channel ID the rajd command posts to. Empty uses the built-in default.
# Always quote the ID, e.g. rajd_channel: "1006248135737221251".
rajd_channel: ""

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10000
  allowPrivilegeEscalation: false

# Playing music runs yt-dlp (Python, plus deno for YouTube's JS challenge) and
# ffmpeg next to the bot; each !play also starts a yt-dlp lookup. A tight CPU
# limit makes songs slow to start and can make audio stutter.
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
